<section class="panel folder-panel summary-panel">
  <div class="folder-header">
    <span class="folder-badge">Summary</span>
    <h2>Summary</h2>
  </div>

  <div class="summary-stats">
    <div class="stat-card accent">
      <span>Total spend</span>
      <strong id="totalSpendValue">₹0.00</strong>
    </div>
    <div class="stat-card">
      <span>Per person</span>
      <strong id="perPersonValue">₹0.00</strong>
    </div>
  </div>

  <div class="section-subheader person-summary-header">
    <h3>Per person summary</h3>
    <div class="summary-actions">
      <button id="shareWhatsAppBtn" class="secondary-btn whatsapp-btn" type="button">
        <span class="whatsapp-icon">💬</span>
        Share on WhatsApp
      </button>
    </div>
  </div>

  <div class="master-payment">
    <label id="masterUpiLabel" class="field-label" for="masterUpiId">Master UPI ID</label>
    <input id="masterUpiId" class="text-input" type="text" autocapitalize="none" spellcheck="false" autocomplete="off" maxlength="320" placeholder="name@bank" />
  </div>
  <div id="whatsAppRecipients" hidden aria-label="WhatsApp recipients"></div>
  <div id="personBreakdown" class="person-breakdown"></div>
</section>
